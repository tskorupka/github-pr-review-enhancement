<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; width: 440px; height: 280px; overflow: hidden;
  }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 28px; box-sizing: border-box;
  }
  h1 { font-size: 25px; line-height: 1.18; margin: 0 0 7px; font-weight: 700; letter-spacing: -0.3px; }
  .tag { color: #8b949e; font-size: 13.5px; margin: 0 0 16px; line-height: 1.45; }
  .mock {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 11px 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.75; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add { color: #3fb950; }
  .hl { background: rgba(56,139,253,.18); border-radius: 4px; padding: 1px 5px; margin: 0 -5px; }
  .dim { color: #6e7681; }
  .badge {
    display: inline-block; background: #1f6feb; color: #fff; border-radius: 999px;
    padding: 0 7px; font-size: 10px; font-weight: 600; margin-left: 7px; vertical-align: 1px;
  }
</style>
</head>
<body>
  <h1>GitHub PR Review<br>Enhancement</h1>
  <p class="tag">Collapse comment walls in PR diffs — hover to highlight, click to expand.</p>
  <div class="mock">
    <div class="row add hl">+ -- Signature identifying the version built from<span class="badge">+12</span></div>
    <div class="row add">+ local function server_signature()</div>
    <div class="row dim">&nbsp;&nbsp;… comment block collapsed</div>
  </div>
</body>
</html>
